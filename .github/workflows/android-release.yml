name: Release Android APK

# Builds the signed release APK and publishes it as a GitHub Release asset,
# giving a one-tap APK download link. Triggers when a version tag (e.g. v1.0.0)
# is pushed, or manually via "Run workflow" against an existing tag.
#
# Requires the same signing secrets as android-build.yml:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Tag drives the human-readable version; run number gives a monotonic code.
      APP_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APP_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Verify signing secret is present
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot build a signed release APK. Add the signing secrets first."
          exit 1

      - name: Checkout (at the tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install client dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Decode release keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage signed APK with versioned name
        run: cp "$GITHUB_WORKSPACE/client/android/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/md-meta-app-${APP_VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_NAME }}
          name: ${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/md-meta-app-${{ env.APP_VERSION_NAME }}.apk
