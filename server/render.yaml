services:
  - type: web
    name: md-meta-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      # Untapped analytics (card negate data). Refresh token from a logged-in ygom.untapped.gg /
      # Companion session; the server stores rotated tokens in the database after first use.
      - key: UNTAPPED_REFRESH_TOKEN
        sync: false
